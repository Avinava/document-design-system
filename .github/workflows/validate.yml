name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Pointed at a directory, `claude plugin validate` checks ONLY the
      # marketplace manifest when both manifests exist — it announces
      # "Validating marketplace manifest: ..." and stops. The plugin manifest
      # is never reached unless it is named directly, so both runs are needed.
      - name: Validate the marketplace manifest
        run: npx -y @anthropic-ai/claude-code plugin validate . --strict

      - name: Validate the plugin manifest
        run: |
          npx -y @anthropic-ai/claude-code plugin validate \
            .claude-plugin/plugin.json --strict

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate repository
        run: python scripts/validate_repository.py .

      - name: Check diagram markup and geometry
        # Every hand-authored figure, rendered figure, and titled inline SVG
        # in examples/, plus the diagram template. Rule IDs are listed by
        # `python scripts/check_diagrams.py --rules`.
        run: python scripts/check_diagrams.py

      - name: Audit every theme
        # Contrast, one-accent, accent hue separation, and the dark-theme print
        # rule. Non-zero exit on any error.
        run: python scripts/audit_theme.py --all --quiet

      - name: Assemble the example document
        run: |
          python scripts/build_document.py templates/document.html \
            --theme editorial-coral --out /tmp/report.html
          # A leftover build marker means the assembled document is missing a
          # stylesheet, which renders as an unstyled page rather than an error.
          ! grep -q '@@INLINE' /tmp/report.html

      - name: Assemble the example deck
        run: |
          python scripts/build_document.py templates/deck.html \
            --theme executive-navy --out /tmp/deck.html
          ! grep -q '@@INLINE' /tmp/deck.html

      - name: Assemble the Pages gallery
        run: python scripts/build_site.py --check

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install the pinned authoring-time renderers
        # package-lock.json pins every version; .npmrc's engine-strict fails
        # the install on a Node older than package.json's engines floor.
        run: npm ci

      - name: Render a diagram and check the output contract
        run: |
          printf 'sequenceDiagram\n  Client->>Gateway: POST /events\n  Gateway->>Queue: enqueue\n' > /tmp/d.mmd
          node scripts/render_diagram.mjs /tmp/d.mmd \
            --id ci --title "Ingestion path" \
            --desc "Client posts events to the gateway, which enqueues them." \
            --out /tmp/d.svg
          # The wrapper exists to guarantee these four properties; if any
          # regresses, the SVG is not safe to inline into a document.
          grep -q 'viewBox=' /tmp/d.svg
          grep -q 'width="100%"' /tmp/d.svg
          grep -q '<title id="ci-title">' /tmp/d.svg
          ! grep -q 'googleapis' /tmp/d.svg
          ! grep -q 'id="arrowhead"' /tmp/d.svg

      - name: Render a chart and check the output contract
        run: |
          cat > /tmp/c.json <<'JSON'
          {"form":"bars","id":"ci-chart",
           "title":"Ingestion holds 41% of the footprint",
           "desc":"Three functions ranked by current size.",
           "data":[{"k":"Ingestion","v":41},{"k":"Transform","v":22},{"k":"Serving","v":18}],
           "x":"v","y":"k","focal":"Ingestion"}
          JSON
          node scripts/render_chart.mjs /tmp/c.json --out /tmp/c.svg
          grep -q 'viewBox=' /tmp/c.svg
          grep -q '<title id="ci-chart-title">' /tmp/c.svg
          grep -q 'var(--accent-tint)' /tmp/c.svg
          # Plot hardcodes a white plot background; the wrapper must neutralize it.
          ! grep -q -- '--plot-background: white' /tmp/c.svg

      - name: Render a waterfall and check its totals
        run: |
          node scripts/render_chart.mjs examples/specs/estimate-bridge.json --out /tmp/w.svg
          grep -q 'viewBox=' /tmp/w.svg
          grep -q '<title id="estimate-bridge-title">' /tmp/w.svg
          grep -q 'data-renderer="render_chart"' /tmp/w.svg
          # Totals take the focal accent; the excluded step is drawn dashed.
          grep -q 'var(--accent-tint)' /tmp/w.svg
          grep -q 'not approved' /tmp/w.svg
          # A declared total that disagrees with its steps must fail the render.
          sed 's/"delta": 24/"delta": 25/' examples/specs/estimate-bridge.json > /tmp/w-bad.json
          ! node scripts/render_chart.mjs /tmp/w-bad.json --out /tmp/w-bad.svg

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Rebuild every example from source
        run: |
          python scripts/build_examples.py
          # The committed examples are the README's screenshots and the CI
          # fixtures. If a figure slot or build marker survives the rebuild,
          # the document renders unstyled or with a hole in it rather than
          # failing outright.
          for f in examples/*.html; do
            ! grep -q '@@INLINE' "$f" || { echo "unresolved build marker in $f"; exit 1; }
            ! grep -q '@FIG' "$f"     || { echo "unresolved figure slot in $f";  exit 1; }
          done

      - name: Examples are in sync with their sources
        run: |
          # A committed example that no longer matches what the build produces
          # means the screenshots in the README are showing something the repo
          # can no longer generate.
          git diff --stat -- examples/
          git diff --exit-code -- examples/ || {
            echo "examples/ is stale — run 'python scripts/build_examples.py' and commit"
            exit 1
          }

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the pinned browser checks
        run: |
          uv venv
          uv pip install -r requirements-authoring.txt
          uv run playwright install --with-deps chromium

      - name: Render every example and check figures stay in bounds
        # 1280, 390 and print widths under every theme: no page-level
        # horizontal scroll, no zero-size figure, no SVG text outside its
        # viewBox, no table spilling from a wrapper that cannot scroll.
        run: uv run python scripts/check_render.py

      - name: Render the Pages site in light and dark
        # Every site page follows the reader's colour scheme, so each is
        # checked under both.
        run: |
          python scripts/build_site.py
          uv run python scripts/check_render.py --root site --scheme light --scheme dark \
            site/index.html site/types.html site/modules.html site/figures.html site/themes.html
