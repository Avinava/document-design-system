<svg role="img" aria-labelledby="lr-title lr-desc" viewBox="0 0 720 380" width="100%" style="max-width:720px" xmlns="http://www.w3.org/2000/svg">
  <title id="lr-title">Fishbone of the 2026-07-30 ingestion halt</title>
  <desc id="lr-desc">A horizontal spine points at the effect, every producer stopped. Six cause families branch off it: trigger, topology and gateway above, mitigation, alerting and producers below. Each family lists two causes from the incident review. The topology bone is drawn in the accent: one shared queue with no failover is the root cause.</desc>

  <defs>
    <marker id="lr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <path class="edge" d="M40 190 H 584" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#lr-arrow)"/>
  <g class="node node-focal">
    <rect x="584" y="160" width="112" height="60" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
    <text x="640" y="186" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">All producers</text>
    <text x="640" y="202" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">stopped</text>
  </g>
  <path class="edge" d="M188 72 L 244 190" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M348 72 L 404 190" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
  <path class="edge" d="M508 72 L 564 190" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M188 308 L 244 190" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M348 308 L 404 190" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M508 308 L 564 190" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M207.0 112 H 191.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M226.0 152 H 210.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M367.0 112 H 351.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M386.0 152 H 370.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M527.0 112 H 511.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M546.0 152 H 530.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M207.0 268 H 191.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M226.0 228 H 210.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M367.0 268 H 351.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M386.0 228 H 370.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M527.0 268 H 511.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M546.0 228 H 530.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <g class="annotation">
    <text x="190.0" y="116" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">Checkout burst</text>
    <text x="209.0" y="156" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">consumer recycling</text>
    <text x="350.0" y="116" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">one shared queue</text>
    <text x="369.0" y="156" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">no failover</text>
    <text x="510.0" y="116" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">waits on the queue</text>
    <text x="529.0" y="156" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">timeouts from 15:40</text>
    <text x="190.0" y="272" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">one replica added</text>
    <text x="209.0" y="232" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">lag flat, then up</text>
    <text x="350.0" y="272" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">5 min over 120 s</text>
    <text x="369.0" y="232" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">no blast radius</text>
    <text x="510.0" y="272" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">no bounded shed</text>
    <text x="529.0" y="232" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">503 or blocked</text>
  </g>
  <g class="node">
    <rect x="132" y="40" width="112" height="32" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="188" y="60" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Trigger</text>
  </g>
  <g class="node">
    <rect x="292" y="40" width="112" height="32" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="348" y="60" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Topology</text>
  </g>
  <g class="node">
    <rect x="452" y="40" width="112" height="32" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="508" y="60" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Gateway</text>
  </g>
  <g class="node">
    <rect x="132" y="308" width="112" height="32" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="188" y="328" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Mitigation</text>
  </g>
  <g class="node">
    <rect x="292" y="308" width="112" height="32" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="348" y="328" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Alerting</text>
  </g>
  <g class="node">
    <rect x="452" y="308" width="112" height="32" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="508" y="328" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Producers</text>
  </g>
  <g class="legend">
    <text x="28" y="364" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--muted)">Each bone is a cause family; each tick a cause from the review. Accent: the root cause.</text>
  </g>
</svg>
