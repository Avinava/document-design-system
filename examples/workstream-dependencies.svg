<svg role="img" aria-labelledby="wsd-title wsd-desc" viewBox="0 0 720 356" width="100%" style="max-width:720px" xmlns="http://www.w3.org/2000/svg">
  <title id="wsd-title">RFC 014 delivery dependencies and the critical path</title>
  <desc id="wsd-desc">Work runs left to right from the RFC 014 decision on 2026-09-01 to production and handoff from 2026-11-02 to 2026-11-20. The decision unblocks the chaos environment and the dispatcher work. The dispatcher feeds staging dual-write and the chaos tests; the chaos environment also feeds the chaos tests. Dual-write, chaos tests, and producer retry fixtures all gate the readiness decision on 2026-10-28, which gates production. The accent marks the critical path through the chaos environment, RAID-01, whose owner has not confirmed the 2026-09-18 date.</desc>

  <defs>
    <marker id="wsd-arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/>
    </marker>
    <marker id="wsd-arrow-focal" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- edges: off the critical path -->
  <path class="edge" d="M136 152 H 144 Q 150 152 150 146 V 86 Q 150 80 156 80 H 164" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#wsd-arrow)"/>
  <path class="edge" d="M276 80 H 304" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#wsd-arrow)"/>
  <path class="edge" d="M276 96 H 284 Q 290 96 290 102 V 150 Q 290 156 296 156 H 304" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#wsd-arrow)"/>
  <path class="edge" d="M416 80 H 424 Q 430 80 430 86 V 142 Q 430 148 436 148 H 444" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#wsd-arrow)"/>
  <path class="edge" d="M416 256 H 424 Q 430 256 430 250 V 194 Q 430 188 436 188 H 444" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#wsd-arrow)"/>

  <!-- edges: the critical path -->
  <path class="edge" d="M136 176 H 164" fill="none" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#wsd-arrow-focal)"/>
  <path class="edge" d="M276 176 H 304" fill="none" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#wsd-arrow-focal)"/>
  <path class="edge" d="M416 168 H 444" fill="none" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#wsd-arrow-focal)"/>
  <path class="edge" d="M556 168 H 584" fill="none" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#wsd-arrow-focal)"/>

  <!-- nodes, columns in date order -->
  <g class="node">
    <rect x="24" y="136" width="112" height="64" rx="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="1"/>
    <text x="80" y="164" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">RFC 014</text>
    <text x="80" y="180" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--muted)">decision 09-01</text>
  </g>
  <g class="node">
    <rect x="164" y="48" width="112" height="64" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="220" y="76" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Dispatcher</text>
    <text x="220" y="92" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--muted)">+ two queues</text>
  </g>
  <g class="node node-focal">
    <rect x="164" y="136" width="112" height="64" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
    <text x="220" y="164" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Environment</text>
    <text x="220" y="180" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--muted)">chaos · 09-18</text>
  </g>
  <g class="node">
    <rect x="304" y="48" width="112" height="64" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="360" y="76" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Dual-write</text>
    <text x="360" y="92" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--muted)">staging 10-12</text>
  </g>
  <g class="node">
    <rect x="304" y="136" width="112" height="64" rx="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="1"/>
    <text x="360" y="164" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Chaos tests</text>
    <text x="360" y="180" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--muted)">one queue down</text>
  </g>
  <g class="node">
    <rect x="304" y="224" width="112" height="64" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="360" y="252" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Retry fixtures</text>
    <text x="360" y="268" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--muted)">producers 10-16</text>
  </g>
  <g class="node">
    <rect x="444" y="136" width="112" height="64" rx="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="1"/>
    <text x="500" y="164" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Readiness</text>
    <text x="500" y="180" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--muted)">decision 10-28</text>
  </g>
  <g class="node">
    <rect x="584" y="136" width="112" height="64" rx="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="1"/>
    <text x="640" y="164" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Production</text>
    <text x="640" y="180" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--muted)">11-02 → 11-20</text>
  </g>

  <g class="callout">
    <path d="M220 200 C 220 212, 220 220, 220 228" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="220" y="244" text-anchor="middle" font-family="var(--sans)" font-size="12" font-style="italic" fill="var(--ink)">RAID-01:<tspan x="220" dy="15">owner unconfirmed</tspan></text>
  </g>

  <g class="legend">
    <path d="M24 312 H 696" stroke="var(--rule)" stroke-width="1"/>
    <path d="M28 332 H 52" stroke="var(--accent)" stroke-width="1.5"/>
    <text x="60" y="336" font-family="var(--sans)" font-size="11" fill="var(--muted)">accent: critical path — a slip here moves production</text>
    <text x="696" y="336" text-anchor="end" font-family="var(--sans)" font-size="11" fill="var(--muted)">Dates are 2026, month-day.</text>
  </g>
</svg>
