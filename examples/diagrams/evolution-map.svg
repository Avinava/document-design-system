<svg role="img" aria-labelledby="ev-title ev-desc" viewBox="0 0 720 396" width="100%" style="max-width:720px" xmlns="http://www.w3.org/2000/svg">
  <title id="ev-title">Evolution map of an alerting service</title>
  <desc id="ev-desc">Components are placed by how visible they are to the user, top to bottom, and by how evolved they are, left to right across genesis, custom, product and commodity. Timely alerts, the user need, sits at the top and depends on alert rules and an ingest queue. Alert rules depend on anomaly scoring, still at genesis and expected to move right. The ingest queue runs on commodity compute.</desc>

  <defs>
    <marker id="ev-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <g class="annotation">
    <path d="M192 44 V 356" stroke="var(--rule)" stroke-width="1" stroke-dasharray="1 3"/>
    <path d="M360 44 V 356" stroke="var(--rule)" stroke-width="1" stroke-dasharray="1 3"/>
    <path d="M528 44 V 356" stroke="var(--rule)" stroke-width="1" stroke-dasharray="1 3"/>
    <text x="28" y="380" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">GENESIS</text>
    <text x="196" y="380" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">CUSTOM</text>
    <text x="364" y="380" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">PRODUCT</text>
    <text x="532" y="380" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">COMMODITY</text>
    <text x="28" y="36" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">VISIBLE TO THE USER</text>
    <text x="28" y="356" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">HIDDEN</text>
  </g>
  <path class="edge" d="M380 84 H 294 Q288 84 288 90 V 144" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#ev-arrow)"/>
  <path class="edge" d="M448 104 V 224" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#ev-arrow)"/>
  <path class="edge" d="M288 184 V 196 Q288 204 280 204 H 120 Q112 204 112 212 V 224" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#ev-arrow)"/>
  <path class="edge" d="M356 164 H 362 Q368 164 368 170 V 238 Q368 244 374 244 H 380" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#ev-arrow)"/>
  <path class="edge" d="M516 244 H 596 Q608 244 608 252 V 304" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#ev-arrow)"/>
  <path class="edge" d="M176 244 H 252" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ev-arrow)"/>
  <g class="edge-label">
    <rect x="184" y="220" width="72" height="16" fill="var(--paper)"/>
    <text x="220" y="232" text-anchor="middle" font-family="var(--sans)" font-size="11" fill="var(--muted)">moving right</text>
  </g>
  <g class="node node-focal">
    <rect x="380" y="64" width="136" height="40" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
    <text x="448" y="88" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Timely alerts</text>
  </g>
  <g class="node">
    <rect x="220" y="144" width="136" height="40" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="288" y="168" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Alert rules</text>
  </g>
  <g class="node">
    <rect x="48" y="224" width="128" height="40" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="112" y="248" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Anomaly scoring</text>
  </g>
  <g class="node">
    <rect x="380" y="224" width="136" height="40" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="448" y="248" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Ingest queue</text>
  </g>
  <g class="node node-muted">
    <rect x="548" y="304" width="120" height="40" rx="6" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/>
    <text x="608" y="328" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--muted)">Compute</text>
  </g>
  <g class="callout">
    <path d="M70 270 C 70 296, 90 308, 118 308" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="124" y="312" font-family="var(--sans)" font-size="12" font-style="italic" fill="var(--ink)">build or buy?</text>
  </g>
</svg>
