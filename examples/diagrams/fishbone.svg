<svg role="img" aria-labelledby="fb-title fb-desc" viewBox="0 0 720 380" width="100%" style="max-width:720px" xmlns="http://www.w3.org/2000/svg">
  <title id="fb-title">Fishbone of late alerts</title>
  <desc id="fb-desc">A horizontal spine points at the effect, alerts arrive late. Six cause families branch off it: producers, pipeline and consumers above, capacity, deploys and alerting below. Each family lists two candidate causes. The pipeline bone is drawn in the accent as the first family to check.</desc>

  <defs>
    <marker id="fb-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <path class="edge" d="M40 190 H 592" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#fb-arrow)"/>
  <g class="node node-focal">
    <rect x="592" y="160" width="104" height="60" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
    <text x="644" y="186" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Alerts</text>
    <text x="644" y="202" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">arrive late</text>
  </g>
  <path class="edge" d="M188 72 L 244 190" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M188 308 L 244 190" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M207.0 112 H 191.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M226.0 152 H 210.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M207.0 268 H 191.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M226.0 228 H 210.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M348 72 L 404 190" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
  <path class="edge" d="M348 308 L 404 190" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M367.0 112 H 351.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M386.0 152 H 370.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M367.0 268 H 351.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M386.0 228 H 370.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M508 72 L 564 190" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M508 308 L 564 190" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M527.0 112 H 511.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M546.0 152 H 530.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M527.0 268 H 511.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path class="edge" d="M546.0 228 H 530.0" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <g class="annotation">
    <text x="187.0" y="116" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">burst retries</text>
    <text x="206.0" y="156" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">schema drift</text>
    <text x="187.0" y="272" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">disk headroom</text>
    <text x="206.0" y="232" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">noisy tenant</text>
    <text x="347.0" y="116" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">single queue</text>
    <text x="366.0" y="156" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">hot partition</text>
    <text x="347.0" y="272" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">peak rollouts</text>
    <text x="366.0" y="232" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">no canary</text>
    <text x="507.0" y="116" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">no autoscale</text>
    <text x="526.0" y="156" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">batch window</text>
    <text x="507.0" y="272" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">stale threshold</text>
    <text x="526.0" y="232" text-anchor="end" font-family="var(--sans)" font-size="12" fill="var(--ink)">no owner</text>
  </g>
  <g class="node">
    <rect x="132" y="40" width="112" height="32" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="188" y="60" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Producers</text>
  </g>
  <g class="node">
    <rect x="132" y="308" width="112" height="32" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="188" y="328" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Capacity</text>
  </g>
  <g class="node">
    <rect x="292" y="40" width="112" height="32" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="348" y="60" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Pipeline</text>
  </g>
  <g class="node">
    <rect x="292" y="308" width="112" height="32" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="348" y="328" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Deploys</text>
  </g>
  <g class="node">
    <rect x="452" y="40" width="112" height="32" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="508" y="60" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Consumers</text>
  </g>
  <g class="node">
    <rect x="452" y="308" width="112" height="32" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="508" y="328" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Alerting</text>
  </g>
  <g class="legend">
    <text x="28" y="364" font-family="var(--sans)" font-size="11" fill="var(--muted)">Each bone is a cause family; each tick is a cause to test. Accent: the family to check first.</text>
  </g>
</svg>
