<svg role="img" aria-labelledby="cy-title cy-desc" viewBox="0 0 720 396" width="100%" style="max-width:720px" xmlns="http://www.w3.org/2000/svg">
  <title id="cy-title">Reinforcing loop of data and alerts</title>
  <desc id="cy-desc">A closed loop of four steps read clockwise: more sources lead to richer data, richer data leads to better alerts, better alerts lead to faster adoption, and faster adoption brings more sources. The accent marks better alerts, the step the team controls.</desc>

  <defs>
    <marker id="cy-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <path class="edge" d="M424 80 Q560 80 560 176" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#cy-arrow)"/>
  <path class="edge" d="M560 224 Q560 320 424 320" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#cy-arrow)"/>
  <path class="edge" d="M296 320 Q160 320 160 224" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#cy-arrow)"/>
  <path class="edge" d="M160 176 Q160 80 296 80" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#cy-arrow)"/>
  <g class="edge-label">
    <rect x="548" y="68" width="76" height="16" fill="var(--paper)"/>
    <text x="586" y="80" text-anchor="middle" font-family="var(--sans)" font-size="11" fill="var(--muted)">more reach</text>
  </g>
  <g class="edge-label">
    <rect x="548" y="332" width="80" height="16" fill="var(--paper)"/>
    <text x="588" y="344" text-anchor="middle" font-family="var(--sans)" font-size="11" fill="var(--muted)">more signal</text>
  </g>
  <g class="edge-label">
    <rect x="92" y="332" width="88" height="16" fill="var(--paper)"/>
    <text x="136" y="344" text-anchor="middle" font-family="var(--sans)" font-size="11" fill="var(--muted)">better alerts</text>
  </g>
  <g class="edge-label">
    <rect x="104" y="68" width="76" height="16" fill="var(--paper)"/>
    <text x="142" y="80" text-anchor="middle" font-family="var(--sans)" font-size="11" fill="var(--muted)">faster start</text>
  </g>
  <g class="node">
    <rect x="296" y="56" width="128" height="48" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="360" y="84" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">More sources</text>
  </g>
  <g class="node">
    <rect x="496" y="176" width="128" height="48" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="560" y="204" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Richer data</text>
  </g>
  <g class="node node-focal">
    <rect x="296" y="296" width="128" height="48" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
    <text x="360" y="324" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Better alerts</text>
  </g>
  <g class="node">
    <rect x="96" y="176" width="128" height="48" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="160" y="204" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Faster adoption</text>
  </g>
  <g class="annotation">
    <text x="360" y="188" text-anchor="middle" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">REINFORCING LOOP</text>
    <text x="360" y="208" text-anchor="middle" font-family="var(--sans)" font-size="12" fill="var(--muted)">Each turn makes the next cheaper.</text>
  </g>
  <g class="legend">
    <text x="28" y="380" font-family="var(--sans)" font-size="11" fill="var(--muted)">Read clockwise from the top. The accent marks the step the team can change.</text>
  </g>
</svg>
