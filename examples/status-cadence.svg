<svg role="img" aria-labelledby="sc-title sc-desc" viewBox="0 0 720 396" width="100%" style="max-width:720px" xmlns="http://www.w3.org/2000/svg">
  <title id="sc-title">Weekly status cadence</title>
  <desc id="sc-desc">A closed loop of four steps read clockwise: the status report carries material movement to the RAID review, Reliability's weekly review feeds the gate forecast, a missed criterion moves the release into a director decision, and the decision is reported in the next status. The accent marks the gate forecast, the step that can move the date.</desc>

  <defs>
    <marker id="sc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <path class="edge" d="M424 80 Q560 80 560 176" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#sc-arrow)"/>
  <path class="edge" d="M560 224 Q560 320 424 320" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#sc-arrow)"/>
  <path class="edge" d="M296 320 Q160 320 160 224" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#sc-arrow)"/>
  <path class="edge" d="M160 176 Q160 80 296 80" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#sc-arrow)"/>
  <g class="edge-label">
    <rect x="536" y="68" width="100" height="16" fill="var(--paper)"/>
    <text x="586" y="80" text-anchor="middle" font-family="var(--sans)" font-size="11" fill="var(--muted)">material movement</text>
  </g>
  <g class="edge-label">
    <rect x="544" y="332" width="84" height="16" fill="var(--paper)"/>
    <text x="586" y="344" text-anchor="middle" font-family="var(--sans)" font-size="11" fill="var(--muted)">weekly review</text>
  </g>
  <g class="edge-label">
    <rect x="96" y="332" width="84" height="16" fill="var(--paper)"/>
    <text x="138" y="344" text-anchor="middle" font-family="var(--sans)" font-size="11" fill="var(--muted)">release moves</text>
  </g>
  <g class="edge-label">
    <rect x="88" y="68" width="80" height="16" fill="var(--paper)"/>
    <text x="128" y="80" text-anchor="middle" font-family="var(--sans)" font-size="11" fill="var(--muted)">reported next</text>
  </g>
  <g class="node">
    <rect x="296" y="56" width="128" height="48" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="360" y="84" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Status report</text>
  </g>
  <g class="node">
    <rect x="496" y="176" width="128" height="48" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="560" y="204" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">RAID review</text>
  </g>
  <g class="node node-focal">
    <rect x="296" y="296" width="128" height="48" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
    <text x="360" y="324" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Gate forecast</text>
  </g>
  <g class="node">
    <rect x="96" y="176" width="128" height="48" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="160" y="196" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Director</text>
    <text x="160" y="212" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">decision</text>
  </g>
  <g class="annotation">
    <text x="360" y="188" text-anchor="middle" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">WEEKLY CADENCE</text>
    <text x="360" y="208" text-anchor="middle" font-family="var(--sans)" font-size="12" fill="var(--muted)">Each report reopens the loop.</text>
  </g>
  <g class="legend">
    <text x="28" y="380" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--muted)">Read clockwise from the top. The accent marks the step that can move the release date.</text>
  </g>
</svg>
