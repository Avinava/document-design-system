<svg role="img" aria-labelledby="qsc-title qsc-desc" viewBox="0 0 720 500" width="100%" style="max-width:720px" xmlns="http://www.w3.org/2000/svg">
  <title id="qsc-title">RFC 014 change view: one queue becomes two</title>
  <desc id="qsc-desc">Today, producers reach the warehouse through the gateway, the single ingest queue, and one consumer group. RFC 014 adds a stateless dispatcher after the gateway that hashes the event ID to one of two queues, ingest-a and ingest-b, each with its own consumer group. The accent marks the dispatcher. A change ledger lists each change by node id: dispatcher added, ingest-a and ingest-b added, consumer group changed, ingest removed once the shadow week closes; producers, gateway and warehouse are unchanged.</desc>

  <defs>
    <marker id="qsc-arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/>
    </marker>
    <marker id="qsc-arrow-focal" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- state labels and change tags: columns line up so unchanged nodes sit
       directly above themselves and the eye reads only the difference -->
  <g class="annotation">
    <text x="28" y="36" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">TODAY</text>
    <text x="376" y="40" font-family="var(--mono)" font-size="11" fill="var(--muted)">removed</text>
    <path d="M24 136 H 696" stroke="var(--rule)" stroke-width="1"/>
    <text x="28" y="160" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">RFC 014 · PROPOSED</text>
    <text x="260" y="200" font-family="var(--mono)" font-size="11" fill="var(--muted)">added</text>
    <text x="376" y="160" font-family="var(--mono)" font-size="11" fill="var(--muted)">added</text>
    <text x="492" y="160" font-family="var(--mono)" font-size="11" fill="var(--muted)">changed</text>
  </g>

  <!-- edges: today -->
  <path class="edge" d="M116 80 H 144" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#qsc-arrow)"/>
  <path class="edge" d="M232 80 H 376" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#qsc-arrow)"/>
  <path class="edge" d="M464 80 H 492" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#qsc-arrow)"/>
  <path class="edge" d="M580 80 H 608" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#qsc-arrow)"/>

  <!-- edges: proposed -->
  <path class="edge" d="M116 240 H 144" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#qsc-arrow)"/>
  <path class="edge" d="M232 240 H 260" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#qsc-arrow)"/>
  <path class="edge" d="M348 228 H 354 Q 360 228 360 222 V 202 Q 360 196 366 196 H 376" fill="none" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#qsc-arrow-focal)"/>
  <path class="edge" d="M348 252 H 354 Q 360 252 360 258 V 278 Q 360 284 366 284 H 376" fill="none" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#qsc-arrow-focal)"/>
  <path class="edge" d="M464 196 H 492" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#qsc-arrow)"/>
  <path class="edge" d="M464 284 H 492" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#qsc-arrow)"/>
  <path class="edge" d="M580 196 H 586 Q 592 196 592 202 V 222 Q 592 228 598 228 H 608" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#qsc-arrow)"/>
  <path class="edge" d="M580 284 H 586 Q 592 284 592 278 V 258 Q 592 252 598 252 H 608" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#qsc-arrow)"/>

  <!-- nodes: today -->
  <g class="node node-muted">
    <rect x="28" y="48" width="88" height="64" rx="6" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/>
    <text x="72" y="84" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--muted)">Producers</text>
  </g>
  <g class="node node-muted">
    <rect x="144" y="48" width="88" height="64" rx="6" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/>
    <text x="188" y="84" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--muted)">Gateway</text>
  </g>
  <g class="node">
    <rect x="376" y="48" width="88" height="64" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="420" y="76" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Queue</text>
    <text x="420" y="92" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--muted)">ingest</text>
  </g>
  <g class="node node-muted">
    <rect x="492" y="48" width="88" height="64" rx="6" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/>
    <text x="536" y="76" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--muted)">Consumers</text>
    <text x="536" y="92" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--muted)">3 replicas</text>
  </g>
  <g class="node node-muted">
    <rect x="608" y="48" width="88" height="64" rx="6" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/>
    <text x="652" y="84" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--muted)">Warehouse</text>
  </g>

  <!-- nodes: proposed -->
  <g class="node node-muted">
    <rect x="28" y="208" width="88" height="64" rx="6" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/>
    <text x="72" y="244" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--muted)">Producers</text>
  </g>
  <g class="node node-muted">
    <rect x="144" y="208" width="88" height="64" rx="6" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/>
    <text x="188" y="244" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--muted)">Gateway</text>
  </g>
  <g class="node node-focal">
    <rect x="260" y="208" width="88" height="64" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
    <text x="304" y="236" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Dispatcher</text>
    <text x="304" y="252" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--muted)">by event ID</text>
  </g>
  <g class="node">
    <rect x="376" y="164" width="88" height="64" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="420" y="192" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Queue</text>
    <text x="420" y="208" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--muted)">ingest-a</text>
  </g>
  <g class="node">
    <rect x="376" y="252" width="88" height="64" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="420" y="280" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Queue</text>
    <text x="420" y="296" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--muted)">ingest-b</text>
  </g>
  <g class="node">
    <rect x="492" y="164" width="88" height="64" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="536" y="192" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Consumers</text>
    <text x="536" y="208" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--muted)">group a</text>
  </g>
  <g class="node">
    <rect x="492" y="252" width="88" height="64" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="536" y="280" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Consumers</text>
    <text x="536" y="296" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--muted)">group b</text>
  </g>
  <g class="node node-muted">
    <rect x="608" y="208" width="88" height="64" rx="6" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/>
    <text x="652" y="244" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--muted)">Warehouse</text>
  </g>

  <!-- change ledger, keyed by node id; the change is written, never only drawn -->
  <g class="legend">
    <path d="M24 344 H 696" stroke="var(--rule)" stroke-width="1"/>
    <text x="28" y="368" font-family="var(--mono)" font-size="11" fill="var(--soft)" letter-spacing="0.14em">CHANGE LEDGER</text>
    <text x="28" y="392" font-family="var(--mono)" font-size="11" fill="var(--ink)">dispatcher</text>
    <text x="188" y="392" font-family="var(--mono)" font-size="11" fill="var(--muted)">added</text>
    <text x="268" y="392" font-family="var(--sans)" font-size="12" fill="var(--ink)">Stateless; hashes the event ID to exactly one queue.</text>
    <text x="28" y="414" font-family="var(--mono)" font-size="11" fill="var(--ink)">ingest-a, ingest-b</text>
    <text x="188" y="414" font-family="var(--mono)" font-size="11" fill="var(--muted)">added</text>
    <text x="268" y="414" font-family="var(--sans)" font-size="12" fill="var(--ink)">Independently recoverable; 24-hour retention unchanged.</text>
    <text x="28" y="436" font-family="var(--mono)" font-size="11" fill="var(--ink)">consumer group</text>
    <text x="188" y="436" font-family="var(--mono)" font-size="11" fill="var(--muted)">changed</text>
    <text x="268" y="436" font-family="var(--sans)" font-size="12" fill="var(--ink)">One group per queue; each scales and recovers alone.</text>
    <text x="28" y="458" font-family="var(--mono)" font-size="11" fill="var(--ink)">ingest</text>
    <text x="188" y="458" font-family="var(--mono)" font-size="11" fill="var(--muted)">removed</text>
    <text x="268" y="458" font-family="var(--sans)" font-size="12" fill="var(--ink)">Stays recoverable until the shadow week closes.</text>
    <text x="28" y="480" font-family="var(--sans)" font-size="11" fill="var(--muted)">Unchanged: producer API, authentication, payload, warehouse schema, batch path.</text>
  </g>
</svg>
