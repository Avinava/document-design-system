<svg role="img" aria-labelledby="ie-title ie-desc" viewBox="0 0 720 468" width="100%" style="max-width:720px" xmlns="http://www.w3.org/2000/svg">
  <title id="ie-title">Evolution map of the ingestion path</title>
  <desc id="ie-desc">Components are placed by how visible they are to a producer, top to bottom, and by how evolved they are, left to right across genesis, custom, product and commodity. Producer apps sit at the top and reach the custom gateway. The gateway feeds the ingest queue, a product, and the proposed dispatcher at genesis, drawn dashed. The consumer group is custom and writes to the commodity warehouse.</desc>

  <defs>
    <marker id="ie-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <g class="annotation">
    <path d="M192 44 V 428" stroke="var(--rule)" stroke-width="1" stroke-dasharray="1 3"/>
    <path d="M360 44 V 428" stroke="var(--rule)" stroke-width="1" stroke-dasharray="1 3"/>
    <path d="M528 44 V 428" stroke="var(--rule)" stroke-width="1" stroke-dasharray="1 3"/>
    <text x="28" y="36" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">VISIBLE TO PRODUCERS</text>
    <text x="28" y="428" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">GENESIS</text>
    <text x="196" y="428" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">CUSTOM</text>
    <text x="364" y="428" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">PRODUCT</text>
    <text x="532" y="428" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">COMMODITY</text>
  </g>
  <path class="edge" d="M288 104 V 144" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#ie-arrow)"/>
  <path class="edge" d="M288 184 V 196 Q288 204 280 204 H 120 Q112 204 112 212 V 224" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ie-arrow)"/>
  <path class="edge" d="M356 164 H 362 Q368 164 368 170 V 238 Q368 244 374 244 H 380" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#ie-arrow)"/>
  <path class="edge" d="M404 264 V 276 Q404 284 396 284 H 296 Q288 284 288 292 V 304" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#ie-arrow)"/>
  <path class="edge" d="M288 344 V 376 Q288 384 296 384 H 548" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#ie-arrow)"/>
  <g class="node">
    <rect x="220" y="64" width="136" height="40" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="288" y="88" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Producer apps</text>
  </g>
  <g class="node">
    <rect x="220" y="144" width="136" height="40" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="288" y="168" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Gateway</text>
  </g>
  <g class="node node-focal">
    <rect x="48" y="224" width="128" height="48" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
    <text x="112" y="244" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Dispatcher</text>
    <text x="112" y="260" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">proposed</text>
  </g>
  <g class="node">
    <rect x="380" y="224" width="136" height="40" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="448" y="248" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Queue ingest</text>
  </g>
  <g class="node">
    <rect x="220" y="304" width="136" height="40" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="288" y="328" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Consumer group</text>
  </g>
  <g class="node node-muted">
    <rect x="548" y="364" width="120" height="40" rx="6" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/>
    <text x="608" y="388" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--muted)">Warehouse</text>
  </g>
  <g class="legend">
    <text x="28" y="452" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--muted)">Placement is an assessment, not a measurement. Dashed edge: proposed, not yet built.</text>
  </g>
</svg>
