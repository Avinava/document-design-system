<svg role="img" aria-labelledby="os-title os-desc" viewBox="0 0 720 348" width="100%" style="max-width:720px" xmlns="http://www.w3.org/2000/svg">
  <title id="os-title">Story map of the operator overview</title>
  <desc id="os-desc">Four steps run left to right: open, read status, find the queue, open the runbook. Release v2.0.0 stacks one story under each step: open from the page, a written status, lag and shed counts, one runbook link. A proposed second release, CR-003, adds a seven-day history under find the queue; the accent marks it as outside the baseline.</desc>

  <defs>
    <marker id="os-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <path class="edge" d="M172 68 H 204" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#os-arrow)"/>
  <path class="edge" d="M344 68 H 376" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#os-arrow)"/>
  <path class="edge" d="M516 68 H 548" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#os-arrow)"/>
  <g class="boundary">
    <rect x="16" y="112" width="688" height="88" rx="6" fill="none" stroke="var(--rule-strong)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="28" y="132" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">V2.0.0 · BASELINE</text>
  </g>
  <g class="boundary">
    <rect x="16" y="216" width="688" height="88" rx="6" fill="none" stroke="var(--rule-strong)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="28" y="236" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">CR-003 · PROPOSED</text>
  </g>
  <g class="node">
    <rect x="32" y="48" width="140" height="40" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="102" y="72" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Open</text>
  </g>
  <g class="node">
    <rect x="32" y="144" width="140" height="40" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="102" y="168" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Open from page</text>
  </g>
  <g class="node">
    <rect x="204" y="48" width="140" height="40" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="274" y="72" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Read status</text>
  </g>
  <g class="node">
    <rect x="204" y="144" width="140" height="40" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="274" y="168" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Written status</text>
  </g>
  <g class="node">
    <rect x="376" y="48" width="140" height="40" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="446" y="72" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Find queue</text>
  </g>
  <g class="node">
    <rect x="376" y="144" width="140" height="40" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="446" y="168" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Lag and sheds</text>
  </g>
  <g class="node">
    <rect x="548" y="48" width="140" height="40" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="618" y="72" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Open runbook</text>
  </g>
  <g class="node">
    <rect x="548" y="144" width="140" height="40" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="618" y="168" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">One runbook link</text>
  </g>
  <g class="node node-focal">
    <rect x="376" y="248" width="140" height="40" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
    <text x="446" y="272" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Seven-day history</text>
  </g>
  <g class="annotation">
    <text x="28" y="36" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">STEPS, IN ORDER OF USE</text>
  </g>
  <g class="legend">
    <text x="28" y="332" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--muted)">Columns are the operator's steps. Rows are releases; CR-003 is proposed and outside the baseline.</text>
  </g>
</svg>
