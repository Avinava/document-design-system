<!doctype html>
<!--
  Figure gallery — every diagram and chart form on one page, in one theme.

  Assemble with:
      python scripts/build_document.py templates/gallery.html \
             --theme editorial-coral --out gallery.html
      # then inline each SVG into its figure slot

  Useful for two things: checking that a theme holds together across every
  figure type, and checking that everything still parses in grayscale.
-->
<html lang="en" data-theme="console-violet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figure gallery</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ---- inlined from core/themes/console-violet.css ---- */
/* console-violet — the dark theme.
 *
 * Register: engineering readouts, ops reviews, incident write-ups, service
 * inventories — documents read on a screen rather than printed. That is a
 * distinct voice, not an inversion of one of the light themes.
 *
 * Why violet and not the obvious choices:
 *
 *   amber  is 6 degrees from --warning. In a system where status colors are
 *          load-bearing, an accent that close to a status hue makes every
 *          genuine warning ambiguous.
 *   teal   is 4 degrees from executive-navy's accent, so the two themes would
 *          be hard to tell apart at thumbnail size.
 *   cyan   on a dark canvas is the "AI dashboard" look that
 *          analytical-document-design lists as an anti-pattern.
 *
 * Violet sits 97 degrees from the nearest status color and more than 60 from
 * every other theme accent. Kept desaturated and paired with hairlines, it
 * reads editorial rather than neon.
 *
 * Status colors are re-tuned rather than inherited: the light themes' values
 * (--positive #34735b and friends) fail contrast on a dark surface, so a dark
 * theme has to restate them regardless.
 *
 * Fonts: IBM Plex Sans (display + sans), IBM Plex Mono. A coherent technical
 * family, distinct from Manrope/Geist and Source Sans.
 *
 * Contrast verified against --surface: ink 13.07, muted 6.94, soft 5.55,
 * accent 5.66, accent-ink on accent 6.63. All clear WCAG AA.
 */

[data-theme="console-violet"] {
  --paper: #1a1d26;
  --surface: #22262f;
  --surface-muted: #2b303c;

  --ink: #edeef2;
  --muted: #a8b0bf;
  --soft: #949dae;

  /* Hairlines invert to light-on-dark at the same opacities the light themes
   * use, per the inversion convention in core/tokens.md. */
  --rule: rgba(237, 238, 242, 0.14);
  --rule-strong: rgba(237, 238, 242, 0.32);

  --accent: #a892e0;
  --accent-tint: rgba(168, 146, 224, 0.14);
  --accent-ink: #16181f;

  --positive: #5cb98b;
  --warning: #f2c14e;
  --critical: #ec6572;

  /* The methodology block goes deeper than the page rather than lighter — on
   * dark, recession reads as "supporting material" the way an inverted panel
   * does on light. */
  --method-bg: #12141b;
  --method-ink: #edeef2;
  --method-muted: #a8b0bf;

  --display: 'IBM Plex Sans', system-ui, sans-serif;
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;

  --radius-sm: 3px;
  --radius-md: 5px;
}

/* --- print ------------------------------------------------------------
 *
 * REQUIRED for any dark theme. core/print.css flattens the surfaces to white
 * but deliberately leaves the ink ramp alone, because for a light theme that
 * ramp is already dark and carries the theme's identity into print.
 *
 * A dark theme inverted onto white paper would print near-white text on white
 * — invisible — with hairlines to match. So the ink ramp is restored here,
 * where the knowledge belongs, rather than by making print.css generically
 * flatten every theme and cost the light themes their per-theme ink.
 *
 * This block wins because the theme is inlined before print.css and
 * [data-theme="console-violet"] outranks [data-theme].
 *
 * The accent survives print unchanged: violet on white is 4.0:1, which
 * carries a focal bar and still reads in grayscale.
 */
@media print {
  [data-theme="console-violet"] {
    --ink: #24272f;
    --muted: #4f5560;
    --soft: #6b7280;

    --rule: rgba(36, 39, 47, 0.14);
    --rule-strong: rgba(36, 39, 47, 0.34);

    --accent-ink: #ffffff;

    --method-ink: #24272f;
    --method-muted: #4f5560;
  }
}
/* ---- inlined from core/base.css ---- */
/* base.css — component-to-token mapping.
 *
 * This file contains NO color literals. Every visual decision resolves through
 * a token defined in core/themes/. That is what makes theme swapping, print
 * normalization, and grayscale survival work without editing components.
 *
 * Load order matters:
 *   1. a theme from core/themes/
 *   2. this file
 *   3. core/print.css   (last, so its overrides beat responsive rules)
 */

/* ---------------------------------------------------------------- reset */

*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* ----------------------------------------------------------- derived */

/* Derived from the base tokens so themes do not have to restate them.
 * If color-mix() is unavailable in a target environment, define
 * --comparison-fill and --track-fill explicitly in the theme instead.
 *
 * Declared on [data-theme] as well as :root so they re-derive at every theme
 * boundary. Defined on :root alone they would resolve once, against the root
 * theme, and a nested [data-theme="…"] section would keep the root's greys
 * while everything around them changed — a subtle wrong that only shows up
 * when two themes appear on one page. */
:root,
[data-theme] {
  --comparison-fill: color-mix(in srgb, var(--muted) 16%, transparent);
  --track-fill: color-mix(in srgb, var(--muted) 10%, transparent);
}

/* --- token aliases for embedded renderers ---------------------------
 *
 * Third-party renderers set their own theme variables on the element they
 * emit. beautiful-mermaid, for example, writes --accent, --muted, and
 * --surface onto its <svg> — names this system already uses.
 *
 * Emitting `--accent: var(--accent)` on that <svg> would be a self-reference,
 * which CSS treats as invalid at computed-value time, so the diagram would
 * lose its colors. Routing through these aliases breaks the cycle: the
 * renderer writes `--accent: var(--dds-accent)`, and --dds-accent resolves
 * here, on :root, where there is no collision.
 *
 * Add an alias whenever a renderer's namespace overlaps a token name.
 *
 * On [data-theme] too, for the same reason as the derived tokens above: a
 * prerendered diagram inside a scoped theme must resolve against that theme. */
:root,
[data-theme] {
  --dds-paper: var(--paper);
  --dds-surface: var(--surface);
  --dds-surface-muted: var(--surface-muted);
  --dds-ink: var(--ink);
  --dds-muted: var(--muted);
  --dds-soft: var(--soft);
  --dds-rule: var(--rule);
  --dds-rule-strong: var(--rule-strong);
  --dds-accent: var(--accent);
  --dds-accent-tint: var(--accent-tint);
}

/* ------------------------------------------------------- typography */

h1, h2, h3,
.metric-value,
.focal-value {
  font-family: var(--display);
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.2;
}

h1 { font-size: 2rem; margin: 0 0 0.5rem; }
h2 { font-size: 1.375rem; margin: 2.5rem 0 0.75rem; }
h3 { font-size: 1.0625rem; margin: 1.75rem 0 0.5rem; }

p { margin: 0 0 1rem; max-width: 68ch; }

/* Mono is for technical metadata only: dates, versions, identifiers, source
 * names, compact labels. Body copy in mono is harder to read, not more
 * credible. */
.meta,
.eyebrow,
time,
code,
.identifier,
.version {
  font-family: var(--mono);
  font-size: 0.8125rem;
  letter-spacing: 0.01em;
}

.eyebrow {
  color: var(--soft);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.subtle { color: var(--muted); }

/* ---------------------------------------------------------- surfaces */

/* Hierarchy comes from borders and spacing, not shadows. */
.card,
.table-wrap,
.callout {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius-md);
  padding: 1.25rem 1.375rem;
}

.chart-frame {
  background: var(--surface-muted);
  border: 1px solid var(--rule);
  border-radius: var(--radius-md);
  padding: 1.25rem;
}

.tag {
  border-radius: var(--radius-sm);
  border: 1px solid var(--rule);
  padding: 0.125rem 0.4375rem;
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--muted);
}

hr,
.rule {
  border: 0;
  border-top: 1px solid var(--rule);
  margin: 2rem 0;
}

/* ------------------------------------------------------------ accent */

/* One accent per visual region. Repeating it across every heading and card
 * destroys the hierarchy it exists to create. */
.focal-value,
.focal-label {
  color: var(--accent);
}

.accent-surface {
  background: var(--accent-tint);
  border: 1px solid var(--accent);
  border-radius: var(--radius-md);
}

.accent-solid {
  background: var(--accent);
  color: var(--accent-ink);
}

/* ------------------------------------------------------------ status */

/* Color alone never carries meaning — every status element also needs a
 * written label, so it survives grayscale and color-blind reading. */
.status-positive { color: var(--positive); }
.status-warning  { color: var(--warning); }
.status-critical { color: var(--critical); }

/* ------------------------------------------------------- methodology */

.methodology {
  background: var(--method-bg);
  color: var(--method-ink);
  border-radius: var(--radius-md);
  padding: 1.5rem 1.625rem;
}

.methodology h2,
.methodology h3 { color: var(--method-ink); }
.methodology .subtle,
.methodology p { color: var(--method-muted); }

/* ------------------------------------------------------------ tables */

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9375rem;
}

th {
  text-align: left;
  font-weight: 600;
  color: var(--muted);
  border-bottom: 1px solid var(--rule-strong);
  padding: 0.5rem 0.625rem;
}

td {
  border-bottom: 1px solid var(--rule);
  padding: 0.5rem 0.625rem;
}

/* Numbers align right and use tabular figures so columns scan vertically. */
.num,
td.num,
th.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

tbody tr:nth-child(even) { background: var(--surface-muted); }

/* On small screens, let wide tables scroll rather than crushing columns.
 * core/print.css unsets this — a scroll container clips in print. */
.table-scroll,
.diagram-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

/* A 720-unit figure squeezed onto a phone sets 13px labels at about 6px.
 * Below this width the figure scrolls inside its wrapper instead, at a size
 * that can still be read; core/print.css resets the floor for paper. */
.diagram-scroll svg { min-width: 560px; }

figure.figure { margin: 1.75rem 0; }
.diagram-scroll > svg { display: block; width: 100%; height: auto; }

/* -------------------------------------------------------------- SVG */

/* Charts and diagrams style through these classes rather than through
 * presentation attributes, so one stylesheet retheme reaches every figure. */
.bar-focal      { fill: var(--accent-tint); stroke: var(--accent); }
.bar-comparison { fill: var(--comparison-fill); stroke: var(--muted); }
.track          { fill: var(--track-fill); }
.axis-line      { stroke: var(--rule-strong); }
.grid-line      { stroke: var(--rule); }
.chart-label    { fill: var(--muted); font-family: var(--sans); font-size: 12px; }
.chart-value    { fill: var(--ink); font-family: var(--sans); font-size: 12px; font-variant-numeric: tabular-nums; }

svg { max-width: 100%; height: auto; }

/* --------------------------------------------------------- utilities */

.print-only { display: none; }

a { color: inherit; text-underline-offset: 2px; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.shell { max-width: 1080px; margin: 0 auto; padding: 40px 32px 64px; }

/* figures: begin — shared with the site's Figures page (scripts/build_site.py) */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
  gap: 24px;
  margin-top: 24px;
}

.fig {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius-md);
  padding: 20px;
}
.fig h3 { margin: 0 0 2px; font-size: 0.9375rem; }
.fig .kind { font-family: var(--mono); font-size: 0.6875rem; color: var(--soft);
             letter-spacing: 0.06em; text-transform: uppercase; }
.fig .frame { background: var(--surface-muted); border: 1px solid var(--rule);
              border-radius: var(--radius-md); padding: 12px; margin-top: 12px; }
.fig figcaption { font-family: var(--mono); font-size: 0.6875rem;
                  color: var(--soft); margin-top: 8px; }

@media (max-width: 640px) { .gallery { grid-template-columns: 1fr; } }
/* figures: end */

@media (max-width: 640px) { .shell { padding: 24px 16px 48px; } }

/* ---- inlined from core/print.css ---- */
/* print.css — print and PDF as a distinct output mode.
 *
 * Load this LAST. Print rendering can match a narrow-viewport media query, so
 * without explicit overrides a desktop grid collapses to one column in the PDF.
 * Placing this after the responsive rules is what prevents that.
 *
 * Browser-added headers and footers (URL, date, page number) are controlled by
 * the print dialog, not by CSS. When a clean PDF matters, tell the user to
 * disable them. Do not claim CSS suppresses them.
 */

@media print {
  @page {
    size: A4 portrait;
    margin: 14mm 14mm 16mm;
  }

  /* --- theme normalization ------------------------------------------
   * Print normalizes to white paper while keeping theme identity through
   * ink, rules, and the accent. Dark methodology panels invert so they do
   * not consume ink or reproduce badly in grayscale. */
  :root,
  [data-theme] {
    --paper: #ffffff;
    --surface: #ffffff;
    --surface-muted: #f3f3f3;
    --method-bg: #ffffff;
    --method-ink: var(--ink);
    --method-muted: var(--muted);
  }

  .methodology {
    border: 1px solid var(--rule-strong);
  }

  html {
    font-size: 10pt;
    background: #fff;
  }

  body {
    min-height: auto;
    background: #fff;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* --- layout -------------------------------------------------------- */

  .report-shell,
  main {
    width: auto;
    max-width: none;
    margin: 0;
    padding: 0;
  }

  .screen-only,
  nav,
  button,
  [role="navigation"] {
    display: none !important;
  }

  .print-only {
    display: block !important;
  }

  /* --- fragmentation --------------------------------------------------
   * Protect small self-contained things. Let big things flow. Setting
   * break-inside: avoid on every section produces half-empty pages when a
   * section is taller than one page. */

  h1, h2, h3 {
    break-after: avoid-page;
    page-break-after: avoid;
  }

  p, li {
    orphans: 3;
    widows: 3;
  }

  .metric-card,
  .chart,
  figure,
  blockquote,
  .callout,
  .methodology {
    break-inside: avoid-page;
    page-break-inside: avoid;
  }

  section {
    break-before: auto;
  }

  .page-break-before {
    break-before: page;
    page-break-before: always;
  }

  .page-break-after {
    break-after: page;
    page-break-after: always;
  }

  /* --- tables ---------------------------------------------------------
   * Long tables span pages with repeating headers. Never break-inside:
   * avoid a whole table — it overflows or leaves large gaps. */

  table {
    width: 100%;
    min-width: 0;
    border-collapse: collapse;
    font-size: 8.5pt;
  }

  thead { display: table-header-group; }
  tfoot { display: table-footer-group; }

  tr {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  th, td {
    padding: 2.2mm 1.6mm;
  }

  /* --- overflow containers --------------------------------------------
   * Changing overflow alone does not stop an oversized child clipping. The
   * min-width reset is the part that actually matters. */

  .table-scroll,
  .diagram-scroll {
    overflow: visible;
  }

  .table-scroll table,
  .diagram-scroll svg {
    min-width: 0 !important;
  }

  svg,
  img,
  canvas {
    max-width: 100% !important;
    height: auto !important;
  }

  /* --- compound components --------------------------------------------
   * Generic structural rules above can strip padding from compound-class
   * elements such as <section class="section methodology">. Restore it with
   * a more specific selector, then check all four insets in the PDF. */

  section.methodology {
    padding: 18px 20px;
  }

  /* --- links -----------------------------------------------------------
   * Append URLs only where the destination matters on paper. Never for
   * fragment-only or javascript: links. */

  a {
    color: inherit;
    text-decoration: none;
  }

  a.external[href^="http"]::after {
    content: " (" attr(href) ")";
    font-family: ui-monospace, monospace;
    font-size: 0.82em;
    overflow-wrap: anywhere;
  }
}

/* US Letter alternative — swap the @page block above when the target
 * organization requires it:
 *
 *   @page { size: Letter portrait; margin: 0.55in 0.55in 0.65in; }
 *
 * Do not switch the whole document to landscape because one table is wide.
 * Simplify the printed columns first, or build a separate landscape appendix.
 */
</style>
</head>

<body>
<div class="shell">
  <p class="eyebrow">document-design-system</p>
  <h1>Figure gallery</h1>
  <p class="subtle">Every figure below consumes the same tokens as the page. Change <code>data-theme</code> on the root element and all of them follow.</p>

  <!-- figures: begin -->
  <div class="gallery">

    <figure class="fig">
      <span class="kind">Diagram · hand-authored SVG</span>
      <h3>Architecture</h3>
      <div class="frame"><svg role="img" aria-labelledby="arch-title arch-desc" viewBox="0 0 720 316" width="100%" style="max-width:720px" xmlns="http://www.w3.org/2000/svg">
  <title id="arch-title">Ingestion architecture</title>
  <desc id="arch-desc">Producers enter through a gateway inside the trust boundary, buffer in a queue, and are consumed into the warehouse. The queue is the only component without a failover, and it carries the whole ingestion path.</desc>

  <defs>
    <marker id="arch-arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/>
    </marker>
    <marker id="arch-arrow-focal" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- boundaries -->
  <g class="boundary">
    <rect x="128" y="56" width="404" height="152" rx="6"
          fill="none" stroke="var(--rule-strong)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="140" y="76" font-family="var(--sans)" font-size="11" fill="var(--soft)"
          letter-spacing="0.06em">TRUST BOUNDARY</text>
  </g>

  <!-- edges (drawn before nodes so line ends sit behind the boxes) -->
  <path class="edge" d="M104 132 H 152" fill="none" stroke="var(--muted)" stroke-width="1"
        marker-end="url(#arch-arrow)"/>
  <path class="edge" d="M312 132 H 360" fill="none" stroke="var(--accent)" stroke-width="1.5"
        marker-end="url(#arch-arrow-focal)"/>
  <path class="edge" d="M520 132 H 568" fill="none" stroke="var(--muted)" stroke-width="1"
        marker-end="url(#arch-arrow)"/>

  <!-- edge label: beside its edge, 8px clear, on a paper backing -->
  <g class="edge-label">
    <rect x="316" y="108" width="40" height="16" fill="var(--paper)"/>
    <text x="336" y="120" text-anchor="middle" font-family="var(--sans)"
          font-size="11" fill="var(--muted)">async</text>
  </g>

  <!-- nodes -->
  <g class="node node-external">
    <rect x="24" y="100" width="80" height="64" rx="6"
          fill="var(--surface)" stroke="var(--rule)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="64" y="136" text-anchor="middle" font-family="var(--sans)"
          font-size="13" fill="var(--soft)">Producers</text>
  </g>

  <g class="node">
    <rect x="152" y="100" width="160" height="64" rx="6"
          fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="232" y="130" text-anchor="middle" font-family="var(--sans)"
          font-size="13" fill="var(--ink)">Gateway</text>
    <text x="232" y="146" text-anchor="middle" font-family="var(--mono)"
          font-size="11" fill="var(--muted)">:8443</text>
  </g>

  <!-- focal node: the one thing the diagram is about -->
  <g class="node node-focal">
    <rect x="360" y="100" width="160" height="64" rx="6"
          fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
    <text x="440" y="130" text-anchor="middle" font-family="var(--sans)"
          font-size="13" fill="var(--ink)">Queue</text>
    <text x="440" y="146" text-anchor="middle" font-family="var(--mono)"
          font-size="11" fill="var(--muted)">single instance</text>
  </g>

  <g class="node node-external">
    <rect x="568" y="100" width="128" height="64" rx="6"
          fill="var(--surface)" stroke="var(--rule)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="632" y="136" text-anchor="middle" font-family="var(--sans)"
          font-size="13" fill="var(--soft)">Warehouse</text>
  </g>

  <!-- callout: dashed Bezier leader, no arrowhead. At most two per diagram. -->
  <g class="callout">
    <path d="M440 100 C 440 72, 456 48, 492 48"
          fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="500" y="52" font-family="var(--sans)" font-size="12"
          font-style="italic" fill="var(--ink)">no failover</text>
  </g>

  <!-- legend: inside the viewBox, or it is lost on export and in print -->
  <g class="legend">
    <path d="M24 268 H 696" stroke="var(--rule)" stroke-width="1"/>
    <text x="24" y="292" font-family="var(--mono)" font-size="11"
          fill="var(--soft)" letter-spacing="0.14em">LEGEND</text>
    <rect x="112" y="280" width="20" height="12" rx="2" fill="var(--surface)"
          stroke="var(--rule)" stroke-dasharray="4 3"/>
    <text x="140" y="290" font-family="var(--sans)" font-size="11" fill="var(--muted)">dashed: outside Platform</text>
    <rect x="312" y="280" width="20" height="12" rx="2" fill="var(--accent-tint)" stroke="var(--accent)"/>
    <text x="340" y="290" font-family="var(--sans)" font-size="11" fill="var(--muted)">accent: single point of failure</text>
  </g>
</svg></div>
      <figcaption>Position carries coupling, so this one is drawn, not laid out.</figcaption>
    </figure>

    <figure class="fig">
      <span class="kind">Diagram · change view</span>
      <h3>What changes, and what does not</h3>
