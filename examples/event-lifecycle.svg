<svg role="img" aria-labelledby="ec-title ec-desc" viewBox="0 0 720 412" width="100%" style="max-width:720px" xmlns="http://www.w3.org/2000/svg">
  <title id="ec-title">Event model of one accepted event</title>
  <desc id="ec-desc">Three slices run left to right on four lanes: caller, command, event and read model. Sending an event posts it and records EventAccepted, marked with the accent, which the warehouse row reflects. Repeating the same ID posts again and gets an acknowledgement with no second row, because the stored ID is read back. Looking up an event goes straight from the caller to the read model, which answers 200 or 404.</desc>

  <defs>
    <marker id="ec-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <g class="annotation">
    <text x="28" y="96" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">CALLER</text>
    <text x="28" y="184" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">COMMAND</text>
    <text x="28" y="272" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">EVENT</text>
    <text x="28" y="360" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">READ MODEL</text>
    <path d="M24 136 H 696" stroke="var(--rule)" stroke-width="1"/>
    <path d="M24 224 H 696" stroke="var(--rule)" stroke-width="1"/>
    <path d="M24 312 H 696" stroke="var(--rule)" stroke-width="1"/>
    <text x="140" y="36" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">SEND EVENT</text>
    <text x="324" y="36" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">REPEAT THE ID</text>
    <text x="508" y="36" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--soft)" letter-spacing="0.06em">LOOK UP</text>
  </g>
  <path class="edge" d="M204 116 V 156" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#ec-arrow)"/>
  <path class="edge" d="M204 204 V 244" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#ec-arrow)"/>
  <path class="edge" d="M204 292 V 332" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#ec-arrow)"/>
  <path class="edge" d="M388 116 V 156" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#ec-arrow)"/>
  <path class="edge" d="M388 204 V 244" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#ec-arrow)"/>
  <path class="edge" d="M388 292 V 332" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#ec-arrow)"/>
  <path class="edge" d="M572 116 V 332" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#ec-arrow)"/>
  <path class="edge" d="M268 356 H 288 Q 296 356 296 348 V 276 Q 296 268 304 268 H 324" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ec-arrow)"/>
  <g class="node">
    <rect x="140" y="68" width="128" height="48" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="204" y="96" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Producer</text>
  </g>
  <g class="node">
    <rect x="140" y="156" width="128" height="48" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="204" y="184" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--ink)">POST /events</text>
  </g>
  <g class="node node-focal">
    <rect x="140" y="244" width="128" height="48" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
    <text x="204" y="272" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--ink)">EventAccepted</text>
  </g>
  <g class="node">
    <rect x="140" y="332" width="128" height="48" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="204" y="360" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Warehouse row</text>
  </g>
  <g class="node">
    <rect x="324" y="68" width="128" height="48" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="388" y="96" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Producer retry</text>
  </g>
  <g class="node">
    <rect x="324" y="156" width="128" height="48" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="388" y="176" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--ink)">POST /events</text>
    <text x="388" y="192" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--ink)">same id</text>
  </g>
  <g class="node">
    <rect x="324" y="244" width="128" height="48" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="388" y="272" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Ack, no new row</text>
  </g>
  <g class="node">
    <rect x="324" y="332" width="128" height="48" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="388" y="360" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Still one row</text>
  </g>
  <g class="node">
    <rect x="508" y="68" width="128" height="48" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="572" y="96" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="var(--ink)">Producer</text>
  </g>
  <g class="node">
    <rect x="508" y="332" width="128" height="48" rx="6" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/>
    <text x="572" y="352" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--ink)">GET /events/{id}</text>
    <text x="572" y="368" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--ink)">200 or 404</text>
  </g>
  <g class="legend">
    <text x="28" y="396" text-anchor="start" font-family="var(--sans)" font-size="11" fill="var(--muted)">Dashed: the stored ID is read back to decide the second answer. Time runs left to right.</text>
  </g>
</svg>
